<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List (LocalStorage)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="task-form" class="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="Add a new task..." required />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <div class="controls">
      <div class="filters" role="tablist" aria-label="Filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="small">Clear completed</button>
    </div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count">0 items</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
